<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Independent study questionnaire</title>
  <script src="survey.js" defer></script>
</head>
<body>
  <main>
    <h1>Study questionnaire</h1>
    <p>Please rate how much you agree with each statement about the tutor.</p>
    <p><strong>1 = Strongly disagree; 10 = Strongly agree.</strong></p>
    <form id="survey-form">
      <div id="rating-items"></div>
      <p><button id="submit-button" type="submit">Submit questionnaire</button></p>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="close-button" type="button" hidden>Close this window</button>
  </main>
</body>
</html>
